name: Validate clang-cl SVML guard
on:
  push:
    branches: [codex/validate-grant-runtime-v2]
    paths: [.github/workflows/validate-opencolorio-clang-cl.yml]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        toolset: [ClangCL]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AcademySoftwareFoundation/OpenColorIO
          ref: 5a808fb57a94c7229640a97835c420c9a1fbd1fe
      - name: Build zlib dependency with MSVC resource compiler environment
        shell: pwsh
        run: |
          $p = 'share/cmake/modules/install/InstallZLIB.cmake'
          $s = [IO.File]::ReadAllText($p)
          $needle = '        GIT_SHALLOW TRUE'
          if (($s.Split($needle).Length - 1) -ne 1) { throw 'Unexpected zlib configuration' }
          $s = $s.Replace($needle, "$needle`n        CMAKE_GENERATOR `"Visual Studio 17 2022`"`n        CMAKE_GENERATOR_PLATFORM x64`n        CMAKE_GENERATOR_TOOLSET v143")
          [IO.File]::WriteAllText($p, $s, [Text.UTF8Encoding]::new($false))
      - name: Configure real AVX build
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T ${{ matrix.toolset }} -DBUILD_SHARED_LIBS=ON -DOCIO_BUILD_APPS=OFF -DOCIO_BUILD_PYTHON=OFF -DOCIO_BUILD_DOCS=OFF -DOCIO_BUILD_GPU_TESTS=OFF -DOCIO_BUILD_TESTS=OFF -DOCIO_USE_SIMD=ON -DOCIO_USE_AVX=ON -DOCIO_USE_AVX2=OFF -DOCIO_USE_AVX512=OFF -DOCIO_INSTALL_EXT_PACKAGES=ALL
          if ($LASTEXITCODE -ne 0) { throw 'Configuration failed' }
      - name: Confirm clang-cl baseline failure
        if: matrix.toolset == 'ClangCL'
        shell: pwsh
        run: |
          cmake --build build --config Release --target OpenColorIO --parallel 4 *> baseline.log
          $buildExit = $LASTEXITCODE
          Get-Content baseline.log -Tail 100
          if ($buildExit -eq 0) { throw 'Baseline unexpectedly passed' }
          if (!(Select-String -Path baseline.log -Pattern "undeclared identifier '_mm_pow_ps'" -Quiet)) { throw 'Failure did not reproduce the reported SVML error' }
          # The failing native build is expected; do not propagate its exit code.
          $global:LASTEXITCODE = 0
      - name: Apply four compiler guards
        shell: pwsh
        run: |
          $sourcePath = 'src/OpenColorIO/ops/fixedfunction/FixedFunctionOpCPU.cpp'
          $sourceText = [IO.File]::ReadAllText($sourcePath)
          $guard = '#if (_MSC_VER >= 1920) && (OCIO_USE_AVX)'
          if (($sourceText.Split($guard).Length - 1) -ne 4) { throw 'Unexpected source gates' }
          $sourceText = $sourceText.Replace($guard, "$guard && !defined(__clang__)")
          [IO.File]::WriteAllText($sourcePath, $sourceText, [Text.UTF8Encoding]::new($false))
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Invalid patch' }
      - name: Add standalone public API regression
        shell: pwsh
        run: |
          @'
          #include <OpenColorIO/OpenColorIO.h>
          #include <algorithm>
          #include <cmath>
          #include <iostream>
          
          namespace OCIO = OCIO_NAMESPACE;
          
          double pq(double linear)
          {
              const double p = std::pow(std::abs(linear) / 100.0, 2610.0 / 16384.0);
              return std::copysign(std::pow((3424.0 / 4096.0 + 2413.0 / 128.0 * p) /
                                           (1.0 + 2392.0 / 128.0 * p), 2523.0 / 32.0), linear);
          }
          
          int main()
          {
              auto config = OCIO::Config::CreateRaw();
              auto transform = OCIO::FixedFunctionTransform::Create();
              transform->setStyle(OCIO::FIXED_FUNCTION_LIN_TO_PQ);
              for (const auto flags : {OCIO::OPTIMIZATION_NONE, OCIO::OPTIMIZATION_FAST_LOG_EXP_POW})
              {
                  transform->setDirection(OCIO::TRANSFORM_DIR_FORWARD);
                  auto encode = config->getProcessor(transform)->getOptimizedCPUProcessor(flags);
                  transform->setDirection(OCIO::TRANSFORM_DIR_INVERSE);
                  auto decode = config->getProcessor(transform)->getOptimizedCPUProcessor(flags);
                  for (float value : {-10.0f, -1.0f, 0.001f, 0.1f, 1.0f, 10.0f, 100.0f})
                  {
                      float pixel[] = {value, value, value, 0.375f};
                      encode->applyRGBA(pixel);
                      for (int channel = 0; channel != 3; ++channel)
                          if (!std::isfinite(pixel[channel]) || std::abs(pixel[channel] - pq(value)) > 0.0001)
                              return 1;
                      if (pixel[3] != 0.375f) return 2;
                      decode->applyRGBA(pixel);
                      for (int channel = 0; channel != 3; ++channel)
                          if (!std::isfinite(pixel[channel]) || std::abs(pixel[channel] - value) >
                              0.001 * std::max(0.001f, std::abs(value))) return 3;
                      if (pixel[3] != 0.375f) return 4;
                  }
              }
              std::cout << "14 public API PQ reference and round-trip cases passed\n";
          }
          '@ | Set-Content -Encoding utf8 pq-smoke.cpp
          @'
          add_executable(pq_smoke pq-smoke.cpp)
          target_link_libraries(pq_smoke PRIVATE OpenColorIO)
          target_compile_features(pq_smoke PRIVATE cxx_std_17)
          add_custom_command(TARGET pq_smoke POST_BUILD COMMAND ${CMAKE_COMMAND} -E copy_if_different $<TARGET_FILE:OpenColorIO> $<TARGET_FILE_DIR:pq_smoke>)
          '@ | Add-Content CMakeLists.txt
          cmake -S . -B build
          if ($LASTEXITCODE -ne 0) { throw 'Smoke configuration failed' }
      - name: Build patched library and public API regression
        shell: pwsh
        run: |
          cmake --build build --config Release --target pq_smoke --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Patched build failed' }
      - name: Run PQ reference and round-trip regression
        shell: pwsh
        run: |
          & ./build/Release/pq_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw 'PQ regression failed' }
